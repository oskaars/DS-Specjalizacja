<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>react 1.7</title>
    <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body>
    <div id="react-app"></div>

    <script type="text/babel">

        const data = [
            {
                id: 1,
                quantity: 1,
                name: "1masło",
                color1:"red",
                color2:"grey",
                color3:"blue"
            },
            {
                id: 2,
                quantity: 2,
                name: "2masło",
                color1:"red",
                color2:"grey",
                color3:"blue"
            },
            {
                id: 3,
                quantity: 3,
                name: "3masło",
                color1:"yellow",
                color2:"brown",
                color3:"red"
            },
            {
                id: 3,
                quantity: 3,
                name: "3masło"
            },
        ]

        const ListItem = (props) => {
            console.log(props)
            return (
                
                <div className="box">
                    <div style = {{"color": props.color1}}>id: {props.id}</div>
                    <div style = {{"color": props.color2}}>{props.quantity}</div>
                    <div style = {{"color": props.color3}}>{props.name}</div>
                </div>
            
            );
        }

        const List = () => {
            const objects = data.map((item, index) => (
                <ListItem key={index} quantity={item.quantity} name={item.name} id={item.id} color1={item.color1} color2={item.color2} color3 = {item.color3} />
            ));
            return (
                <>
                    {objects}
                </>
            )
        }

        ReactDOM.render(
            <>
                <List/>
            </>



            ,

            document.getElementById('react-app')
        );

    </script>
</body>

</html>
