<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react 2.2</title>
    <script
      crossorigin
      src="https://unpkg.com/react@17.0.2/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="react-app"></div>

    <script type="text/babel">
      const Square = () => {
        const [data, setData] = React.useState({ a: 1 });

        const onButtonClick = () => {
          if (data.a == 1) setData({a:2});
          else if (data.a == 2) setData({a:3});
          else setData({a:1});
        };

        return (
          <div>
            <div>{data.a}</div>
            <button onClick={onButtonClick}>klik</button>
          </div>
        );
      };

      ReactDOM.render(
        <>
          <Square />
          <Square />
          <Square />
        </>,

        document.getElementById("react-app"),
      );
    </script>
  </body>
</html>
