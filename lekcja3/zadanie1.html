<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react 3.2</title>
    <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="react-app"></div>

    <script type="text/babel">


        const MyForm = () => {

            const [selected, setSelected] = React.useState([])

            const handleSubmit = (event) => {
                event.preventDefault();
                setData("");
            }

            const books = [
                { id: 0, name: "Hamlet" },
                { id: 1, name: "Krzyzacy" },
                { id: 2, name: "Lalka" },
                { id: 3, name: "Proces" }
            ]
            const cities = [
                { id: 0, name: "Kraków" },
                { id: 1, name: "Warszawa" },
                { id: 2, name: "Gdańsk" }
            ]

            const handleSelect = (selectedPassed) =>{
                console.log(selectedPassed)
                setSelected([...selected, selectedPassed])
            }

            return (
                <>
                <form onSubmit={handleSubmit}>
                    <MySelect arr={books} handleSelect={handleSelect}/>
                    <MySelect arr={cities} handleSelect={handleSelect}/>
                </form>
                <div>
                    wybrano: {selected}    
                </div>
                </>
            )

        }

        const MySelect = (props) => {

            const [data, setData] = React.useState("")

            const selectArr = props.arr
            console.log(selectArr)

            const handleChange = (event) =>{
                console.log(event.target.value)
                setData(event.target.value)
                props.handleSelect(event.target.value)
            }

            return (
                <select onChange={handleChange} value={data}>
                    {
                        selectArr.map((element, index)=>{
                            return <option key={index}>{element.name}</option>
                        })
                    }
                </select>
            )
        }

        ReactDOM.render(
            <>
                <MyForm />
            </>,

            document.getElementById("react-app"),
        );
    </script>
</body>

</html>
