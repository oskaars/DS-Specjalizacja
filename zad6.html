<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>react 1.3</title>
    <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body>
    <div id="react-app"></div>

    <script type="text/babel">

        const data = [
            {
                id: 1,
                quantity: 1,
                name: "1masło"
            },
            {
                id: 2,
                quantity: 2,
                name: "2masło"
            },
            {
                id: 3,
                quantity: 3,
                name: "3masło"
            },
                        {
                id: 3,
                quantity: 3,
                name: "3masło"
            },
        ]

        const ListItem = (props) => {
            console.log(props)
            return (
                <div className="klasa">
                    {props.quantity} x {props.name}
                </div>
            );
        }

        const List1 = () => {
            return (
                <>
                    <ListItem quantity={data[0].quantity} name={data[0].name}></ListItem>
                    <ListItem quantity={data[1].quantity} name={data[1].name}></ListItem>
                    <ListItem quantity={data[2].quantity} name={data[2].name}></ListItem>
                </>
            )
        }
        const List2 = () => {
            const objects = data.map((item, index) => (
                <ListItem key={index} quantity={item.quantity} name={item.name} />
            ));
            return (
                <>
                    {objects}
                </>
            )
        }

        ReactDOM.render(
            <>
                <List1 />
                <List2 />
            </>



            ,

            document.getElementById('react-app')
        );

    </script>
</body>

</html>
